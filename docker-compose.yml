# Один файл и для прода, и для тестового окружения в Dokploy. Имена контейнеров
# не задаём — Docker сам добавит префикс проекта, и два стека не столкнутся.
# Домены и имена роутеров Traefik берутся из .env (по умолчанию — прод):
#   ROUTER_PREFIX=wishlist-test
#   API_HOST=api.test.prosto-namekni.ru

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: "${DB_NAME}"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ../files/pgdata:/var/lib/postgresql/data/pgdata
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    command: >
      postgres -c max_connections=1000
               -c shared_buffers=256MB
               -c effective_cache_size=768MB
               -c maintenance_work_mem=64MB
               -c checkpoint_completion_target=0.7
               -c wal_buffers=16MB
               -c default_statistics_target=100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - internal
    restart: unless-stopped

  server:
    restart: unless-stopped
    build:
      context: .
    env_file:
      - .env
    environment:
      S3_ENDPOINT: "${S3_ENDPOINT:?Set S3_ENDPOINT}"
      S3_REGION: "${S3_REGION:-ru-central1}"
      S3_BUCKET_NAME: "${S3_BUCKET_NAME:?Set S3_BUCKET_NAME}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}"
      S3_PUBLIC_URL: "${S3_PUBLIC_URL:?Set S3_PUBLIC_URL}"
      S3_USE_SSL: "${S3_USE_SSL:-true}"
      S3_AUTO_CREATE_BUCKET: "false"
    networks:
      - internal
      - dokploy-network
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${ROUTER_PREFIX:-wishlist}-api.rule=Host(`${API_HOST:-api.prosto-namekni.ru}`)"
      - "traefik.http.routers.${ROUTER_PREFIX:-wishlist}-api.entrypoints=websecure"
      - "traefik.http.routers.${ROUTER_PREFIX:-wishlist}-api.tls.certResolver=letsencrypt"
      - "traefik.http.services.${ROUTER_PREFIX:-wishlist}-api.loadbalancer.server.port=8080"

networks:
  internal:
    driver: bridge
  dokploy-network:
    external: true
